version: 2.1

# CircleCI is an optional CI backend for the same Android 16-only build.
# The job deliberately uses a Linux VM: the output is a Linux x86_64 ART/ATL
# runtime, not a macOS or Android artifact.
jobs:
  android16-art:
    machine:
      image: ubuntu-2404:current
    # CircleCI Free plan maximum Linux VM class: 4 vCPUs / 15 GB RAM.
    resource_class: large
    environment:
      USE_CCACHE: "1"
    steps:
      - checkout
      - run:
          name: Install AOSP host dependencies
          command: |
            # CircleCI selected a very slow US-East Ubuntu mirror for this
            # runner. Use a stable EU mirror; runner geography itself is not
            # selectable on the Free plan.
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
              -exec sed -i \
                -e 's#https\?://[^ ]*archive\.ubuntu\.com/ubuntu#http://de.archive.ubuntu.com/ubuntu#g' \
                -e 's#https\?://security\.ubuntu\.com/ubuntu#http://de.archive.ubuntu.com/ubuntu#g' {} +
            printf 'Acquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
            sudo apt-get update
            sudo apt-get install -y \
              adb bc bison build-essential ccache curl flex g++-multilib \
              gcc-multilib git gn lib32ncurses-dev lib32readline-dev \
              lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev \
              libxml2-utils lzop pngcrush repo rsync schedtool \
              squashfs-tools unzip xsltproc zip zlib1g-dev
      - restore_cache:
          keys:
            - circle-aosp-repo-v1-{{ checksum "third_party/aosp_android16/ATL_ANDROID16_BASE.md" }}
            - circle-aosp-repo-v1-
      - restore_cache:
          keys:
            - circle-ccache-v1-{{ checksum "third_party/aosp_android16/ATL_ANDROID16_BASE.md" }}
            - circle-ccache-v1-
      - run:
          name: Initialize and sync Android 16 master-art
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p .ci/aosp-master-art
            cd .ci/aosp-master-art
            if [[ ! -d .repo ]]; then
              repo init \
                -u https://android.googlesource.com/platform/manifest \
                -b master-art --partial-clone --no-use-superproject
            fi
            repo sync -c --no-tags --optimized-fetch --prune -j"$(nproc)"
      - save_cache:
          key: circle-aosp-repo-v1-{{ checksum "third_party/aosp_android16/ATL_ANDROID16_BASE.md" }}
          paths:
            - .ci/aosp-master-art/.repo
      - run:
          name: Verify Android 16 release pins
          command: |
            set -euo pipefail
            declare -A pins=(
              [art]=ed6c006bd06ae060bd9698fd2cb25c4865512ec3
              [libcore]=fff4fcc0cf7f080cf2511cbb57561482b13b218f
              [dalvik]=0c8569a6f7492b1ba639d33e22fe9cf6f45a80ac
            )
            mkdir -p .ci/aosp-android16-pins
            for project in "${!pins[@]}"; do
              dir=".ci/aosp-android16-pins/$project"
              git clone --filter=blob:none --no-checkout \
                "https://android.googlesource.com/platform/$project" "$dir"
              git -C "$dir" fetch --depth=1 origin "${pins[$project]}"
              git -C "$dir" checkout --detach "${pins[$project]}"
              test "$(git -C "$dir" rev-parse HEAD)" = "${pins[$project]}"
            done
      - run:
          name: Build Android 16 ART host runtime
          no_output_timeout: 60m
          command: |
            set -eo pipefail
            ccache -M 10G
            cd .ci/aosp-master-art
            source build/envsetup.sh
            set -u
            banchan com.android.art x86_64
            m apps_only dist
            m dalvikvm64 libart libnativebridge
            mkdir -p android16-host-art
            for path in \
              out/host/linux-x86/bin/dalvikvm64 \
              out/host/linux-x86/lib64/libart.so \
              out/host/linux-x86/lib64/libnativebridge.so; do
              test -f "$path"
              cp --parents "$path" android16-host-art/
            done
            for path in \
              out/host/linux-x86/lib64/libandroidfw.so \
              out/host/linux-x86/lib64/libartbase.so \
              out/host/linux-x86/lib64/libdexfile.so \
              out/host/linux-x86/lib64/liblog.so \
              out/host/linux-x86/lib64/libsigchain.so \
              out/host/linux-x86/lib64/libutils.so \
              out/host/linux-x86/lib64/libziparchive.so \
              out/host/linux-x86/framework/core-oj-hostdex.jar \
              out/host/linux-x86/framework/core-libart-hostdex.jar; do
              [[ -f "$path" ]] && cp --parents "$path" android16-host-art/
            done
            tar -czf android16-host-art.tar.gz -C android16-host-art .
      - save_cache:
          key: circle-ccache-v1-{{ checksum "third_party/aosp_android16/ATL_ANDROID16_BASE.md" }}
          paths:
            - ~/.cache/ccache
      - persist_to_workspace:
          root: .ci
          paths:
            - aosp-master-art/android16-host-art.tar.gz
      - store_artifacts:
          path: .ci/aosp-master-art/out/dist
          destination: com.android.art-x86_64
      - store_artifacts:
          path: .ci/aosp-master-art/android16-host-art.tar.gz
          destination: android16-host-art-x86_64.tar.gz

  android16-atl-adapter:
    machine:
      image: ubuntu-2404:current
    # CircleCI Free plan maximum Linux VM class: 4 vCPUs / 15 GB RAM.
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .ci
      - run:
          name: Install ATL adapter dependencies
          command: |
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
              -exec sed -i \
                -e 's#https\?://[^ ]*archive\.ubuntu\.com/ubuntu#http://de.archive.ubuntu.com/ubuntu#g' \
                -e 's#https\?://security\.ubuntu\.com/ubuntu#http://de.archive.ubuntu.com/ubuntu#g' {} +
            printf 'Acquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build meson pkg-config default-jdk \
              libegl-dev libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
              libsdl3-dev libasound2-dev libavcodec-dev libcap-dev libdrm-dev \
              libffi-dev libglib2.0-dev libgudev-1.0-dev libportal-dev \
              libsqlite3-dev libvulkan-dev libopenxr-dev libunwind-dev \
              libelf-dev libicu-dev libssl-dev libexpat1-dev liblz4-dev \
              liblzma-dev zlib1g-dev autoconf automake libtool
      - run:
          name: Build ATL support libraries
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p .ci/deps
            meson setup .ci/bionic-build third_party/bionic_translation \
              --buildtype=release --prefix="$PWD/.ci/deps"
            meson compile -C .ci/bionic-build
            meson install -C .ci/bionic-build
            cd third_party/wolfssl
            autoreconf -i
            ./configure --prefix="$CIRCLE_WORKING_DIRECTORY/.ci/deps" \
              --enable-shared --disable-opensslall --disable-opensslextra \
              --enable-aescbc-length-checks --enable-curve25519 \
              --enable-ed25519 --enable-ed25519-stream --enable-oldtls \
              --enable-base64encode --enable-tlsx --enable-scrypt \
              --disable-examples --enable-crl --with-rsa --enable-certs \
              --enable-sessioncerts --enable-jni
            make -j"$(nproc)"
            make install
      - run:
          name: Stage Android 16 host runtime
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p .ci/host-art .ci/android16-runtime
            tar -xzf .ci/aosp-master-art/android16-host-art.tar.gz -C .ci/host-art
            make -C third_party/art_standalone -j"$(nproc)" libandroidfw
            bash third_party/aosp_android16/prepare_host_runtime.sh \
              .ci/host-art .ci/android16-runtime third_party/art_standalone
      - run:
          name: Build Nuah ATL Android 16 runtime
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            export PKG_CONFIG_PATH="$PWD/.ci/android16-runtime/pkgconfig:$PWD/.ci/deps/lib/pkgconfig:$PWD/.ci/deps/lib64/pkgconfig"
            export LD_LIBRARY_PATH="$PWD/.ci/deps/lib:$PWD/.ci/deps/lib64:${LD_LIBRARY_PATH:-}"
            bootclasspath=$(cat .ci/android16-runtime/bootclasspath.build.txt)
            cmake -S . -B build-android16-ci -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DNUAH_ATL_BOOTCLASSPATH="$bootclasspath" \
              -DNUAH_ATL_JAVA_HOME="${JAVA_HOME}"
            cmake --build build-android16-ci --target nuah nuah-services
            ctest --test-dir build-android16-ci --output-on-failure
            mkdir -p .ci/android16-runtime/natives
            cp build-android16-ci/atl-full/android-translation-layer .ci/android16-runtime/
            cp build-android16-ci/atl-full/libtranslation_layer_main.so .ci/android16-runtime/natives/
            cp build-android16-ci/atl-full/libandroid.so.0 .ci/android16-runtime/natives/
            cp build-android16-ci/nuah build-android16-ci/nuah-services .ci/android16-runtime/
            test -x .ci/android16-runtime/android-translation-layer
            test -s .ci/android16-runtime/natives/libtranslation_layer_main.so
            test -s .ci/android16-runtime/bootclasspath.txt
            tar -czf android16-atl-runtime.tar.gz -C .ci android16-runtime
      - store_artifacts:
          path: android16-atl-runtime.tar.gz
          destination: android16-atl-runtime-x86_64.tar.gz

workflows:
  android16:
    jobs:
      - android16-art
      - android16-atl-adapter:
          requires:
            - android16-art
