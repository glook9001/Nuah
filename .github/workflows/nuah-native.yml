name: Nuah native runtime

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'nuah/**'
      - '.github/workflows/nuah-native.yml'
  workflow_dispatch:

concurrency:
  group: nuah-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            default-jdk libegl-dev libgtk-4-dev libadwaita-1-dev \
            libwebkitgtk-6.0-dev libasound2-dev libpipewire-0.3-dev \
            libpulse-dev libsndio-dev libxss-dev libgbm-dev libdecor-0-dev \
            libavcodec-dev libcap-dev libdrm-dev libffi-dev \
            libglib2.0-dev libgudev-1.0-dev libportal-dev libsqlite3-dev \
            libvulkan-dev libopenxr-dev libunwind-dev libelf-dev \
            libicu-dev libssl-dev libexpat1-dev liblz4-dev liblzma-dev \
            zlib1g-dev

      - name: Install prebuilt SDL3 development package
        run: |
          set -euo pipefail
          mkdir -p .ci/sdl3
          base=https://deb.debian.org/debian/pool/main/libs/libsdl3
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/libsdl3-0_3.2.10+ds-1_amd64.deb" \
            -o .ci/sdl3/libsdl3-0.deb
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/libsdl3-dev_3.2.10+ds-1_amd64.deb" \
            -o .ci/sdl3/libsdl3-dev.deb
          dpkg-deb -x .ci/sdl3/libsdl3-0.deb .ci/sdl3/root
          dpkg-deb -x .ci/sdl3/libsdl3-dev.deb .ci/sdl3/root
          prefix="$GITHUB_WORKSPACE/.ci/sdl3/root"
          echo "PKG_CONFIG_PATH=$prefix/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure Nuah native runtime
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNUAH_BUILD_ATL=OFF

      - name: Build native providers and supervisor
        run: cmake --build build-ci --parallel

      - name: Run native ABI tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Publish native runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuah-native-runtime-x86_64
          path: |
            build-ci/nuah
            build-ci/nuah-services
            build-ci/android/*.so
          if-no-files-found: error
