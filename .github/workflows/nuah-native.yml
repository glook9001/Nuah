name: Nuah native runtime

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'nuah/**'
      - 'third_party/libhybris.lock'
      - 'NUAH_LIBHYBRIS_PIVOT.md'
      - '.github/workflows/nuah-native.yml'
  workflow_dispatch:

concurrency:
  group: nuah-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybris-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect pinned libhybris loader source
        run: |
          set -euo pipefail
          . third_party/libhybris.lock
          test "$required_arch" = x86-64
          test "$required_android_api" = 36
          git clone --filter=blob:none --no-checkout "$repository" hybris-source
          git -C hybris-source checkout --detach "$revision"
          test "$(git -C hybris-source rev-parse HEAD)" = "$revision"
          git -C hybris-source apply --recount --check \
            "$GITHUB_WORKSPACE/nuah/libhybris_patches/0001-virtual-host-hook-dependencies.patch"
          test -f hybris-source/hybris/configure.ac
          test -f hybris-source/hybris/common/q/linker.cpp
          grep -F 'xx86-64' hybris-source/hybris/configure.ac
          grep -F "android_dlopen" hybris-source/hybris/common/hooks.c

      - name: Record upstream x86_64 compatibility warning
        run: |
          set -euo pipefail
          if grep -qi 'only supports 32 bit' hybris-source/hybris/README; then
            echo '::warning::Upstream libhybris documents 64-bit support as incomplete.'
            echo 'Nuah will exercise the x86_64 linker as an experimental backend.'
            exit 0
          fi
          echo 'Source no longer rejects 64-bit support; API-36 smoke build is next.'

  hybris-x86_64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the small libhybris build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            build-essential libglib2.0-dev

      - name: Fetch the pinned libhybris source
        run: |
          set -euo pipefail
          . third_party/libhybris.lock
          git clone --filter=blob:none "$repository" hybris-source
          git -C hybris-source checkout --detach "$revision"
          git -C hybris-source apply --recount \
            "$GITHUB_WORKSPACE/nuah/libhybris_patches/0001-virtual-host-hook-dependencies.patch"

      - name: Build the x86_64 libhybris common loader
        run: |
          set -euo pipefail
          cd hybris-source/hybris
          autoreconf -vfi
          ./configure \
            --enable-arch=x86-64 \
            --with-android-headers="$GITHUB_WORKSPACE/nuah/hybris_headers" \
            --prefix="$GITHUB_WORKSPACE/hybris-prefix"
          make -C common -j"$(nproc)"
          make -C common install

      - name: Publish the experimental libhybris loader
        uses: actions/upload-artifact@v4
        with:
          name: nuah-libhybris-x86_64
          path: |
            hybris-prefix
          if-no-files-found: error

  hybris-loader-smoke:
    needs: hybris-x86_64-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve the matching libhybris runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: nuah-libhybris-x86_64
          path: hybris-prefix

      - name: Build a no-dependency Android-loader probe
        run: |
          set -euo pipefail
          mkdir -p hybris-probe
          cc -fPIC -shared -nostdlib -Wl,-soname,libnuah-hybris-probe.so \
            -o hybris-probe/libnuah-hybris-probe.so nuah/tests/hybris_probe_module.c
          cc -Wall -Wextra -Werror -o hybris-probe/hybris_loader_probe \
            nuah/tests/hybris_loader_probe.c -ldl

      - name: Load the probe with libhybris android_dlopen
        run: |
          set -euo pipefail
          test -f hybris-prefix/lib/libhybris-common.so
          test -f hybris-prefix/lib/libhybris/linker/q.so
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hybris-prefix/lib" \
            hybris-probe/hybris_loader_probe \
            "$GITHUB_WORKSPACE/hybris-probe/libnuah-hybris-probe.so"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hybris-prefix/lib" \
            hybris-probe/hybris_loader_probe libc.so

  build:
    needs: hybris-x86_64-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve the pinned libhybris runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: nuah-libhybris-x86_64
          path: build-ci/hybris

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            default-jdk libegl-dev libgtk-4-dev libadwaita-1-dev \
            libwebkitgtk-6.0-dev libasound2-dev libpipewire-0.3-dev \
            libpulse-dev libsndio-dev libxss-dev libgbm-dev libdecor-0-dev \
            libavcodec-dev libcap-dev libdrm-dev libffi-dev \
            libglib2.0-dev libgudev-1.0-dev libportal-dev libsqlite3-dev \
            libvulkan-dev libopenxr-dev libunwind-dev libelf-dev \
            libicu-dev libssl-dev libexpat1-dev liblz4-dev liblzma-dev \
            zlib1g-dev

      - name: Install prebuilt SDL3 development package
        run: |
          set -euo pipefail
          mkdir -p .ci/sdl3
          base=https://deb.debian.org/debian/pool/main/libs/libsdl3
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/libsdl3-0_3.2.10+ds-1_amd64.deb" \
            -o .ci/sdl3/libsdl3-0.deb
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/libsdl3-dev_3.2.10+ds-1_amd64.deb" \
            -o .ci/sdl3/libsdl3-dev.deb
          dpkg-deb -x .ci/sdl3/libsdl3-0.deb .ci/sdl3/root
          dpkg-deb -x .ci/sdl3/libsdl3-dev.deb .ci/sdl3/root
          prefix="$GITHUB_WORKSPACE/.ci/sdl3/root"
          echo "PKG_CONFIG_PATH=$prefix/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure Nuah native runtime
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNUAH_BUILD_ATL=OFF \
            -DNUAH_SDL3_ROOT="$GITHUB_WORKSPACE/.ci/sdl3/root"

      - name: Build native providers and supervisor
        run: cmake --build build-ci --parallel

      - name: Run native ABI tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Publish native runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuah-native-runtime-x86_64
          path: |
            build-ci/nuah
            build-ci/nuah-services
            build-ci/libnuah_host_bridge.so
            build-ci/libnuah_atl_overlay.so
            build-ci/android/*.so
            build-ci/hybris/lib/libhybris-common.so*
            build-ci/hybris/lib/libhybris/linker/*.so
          if-no-files-found: error
