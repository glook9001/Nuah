name: Nuah native runtime

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'nuah/**'
      - 'third_party/libhybris.lock'
      - 'third_party/libnativehelper/**'
      - 'third_party/android2gnulinux/**'
      - '.gitmodules'
      - 'NUAH_LIBHYBRIS_PIVOT.md'
      - '.github/workflows/nuah-native.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nuah-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybris-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect pinned libhybris loader source
        run: |
          set -euo pipefail
          . third_party/libhybris.lock
          test "$required_arch" = x86-64
          test "$required_android_api" = 36
          git clone --filter=blob:none --no-checkout "$repository" hybris-source
          git -C hybris-source checkout --detach "$revision"
          test "$(git -C hybris-source rev-parse HEAD)" = "$revision"
          git -C hybris-source/hybris apply --recount --check \
            "$GITHUB_WORKSPACE/nuah/libhybris_patches/0002-expose-builtin-hook-resolution.patch"
          test -f hybris-source/hybris/configure.ac
          test -f hybris-source/hybris/common/q/linker.cpp
          grep -F 'x86-64' hybris-source/hybris/configure.ac
          grep -F "android_dlopen" hybris-source/hybris/common/hooks.c

      - name: Record upstream x86_64 compatibility warning
        run: |
          set -euo pipefail
          if grep -qi 'only supports 32 bit' hybris-source/hybris/README; then
            echo '::warning::Upstream libhybris documents 64-bit support as incomplete.'
            echo 'Nuah will exercise the x86_64 linker as an experimental backend.'
            exit 0
          fi
          echo 'Source no longer rejects 64-bit support; API-36 smoke build is next.'

  hybris-x86_64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the small libhybris build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            build-essential libglib2.0-dev

      - name: Fetch the pinned libhybris source
        run: |
          set -euo pipefail
          . third_party/libhybris.lock
          git clone --filter=blob:none "$repository" hybris-source
          git -C hybris-source checkout --detach "$revision"
          git -C hybris-source/hybris apply --recount \
            "$GITHUB_WORKSPACE/nuah/libhybris_patches/0002-expose-builtin-hook-resolution.patch"

      - name: Build the x86_64 libhybris common loader
        run: |
          set -euo pipefail
          cd hybris-source/hybris
          autoreconf -vfi
          ./configure \
            --enable-arch=x86-64 \
            --with-android-headers="$GITHUB_WORKSPACE/nuah/hybris_headers" \
            --prefix="$GITHUB_WORKSPACE/hybris-prefix"
          make -C common -j"$(nproc)"
          make -C common install

      - name: Publish the experimental libhybris loader
        uses: actions/upload-artifact@v4
        with:
          name: nuah-libhybris-x86_64
          path: |
            hybris-prefix
          if-no-files-found: error

  hybris-loader-smoke:
    needs: hybris-x86_64-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Retrieve the matching libhybris runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: nuah-libhybris-x86_64
          path: hybris-prefix

      - name: Install loader crash diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb

      - name: Build Android-loader probes
        run: |
          set -euo pipefail
          mkdir -p hybris-probe/providers
          cc -fPIC -shared -nostdlib -Wl,-soname,libnuah-hybris-probe.so \
            -o hybris-probe/libnuah-hybris-probe.so nuah/tests/hybris_probe_module.c
          cc -fPIC -shared -nostdlib -Wl,-soname,libandroid.so \
            -o hybris-probe/providers/libandroid.so nuah/tests/hybris_probe_module.c
          cc -fPIC -shared -nostdlib -Wl,-soname,libnuah-hybris-host-dependency-probe.so \
            -Wl,--no-as-needed -Lhybris-probe/providers -landroid -Wl,--as-needed \
            -o hybris-probe/libnuah-hybris-host-dependency-probe.so \
            nuah/tests/hybris_host_dependency_probe.c
          readelf --dynamic hybris-probe/libnuah-hybris-host-dependency-probe.so | \
            grep -F 'Shared library: [libandroid.so]'
          cc -Wall -Wextra -Werror -o hybris-probe/hybris_loader_probe \
            nuah/tests/hybris_loader_probe.c -ldl

      - name: Load the probe with libhybris android_dlopen
        run: |
          set -euo pipefail
          test -f hybris-prefix/lib/libhybris-common.so
          test -f hybris-prefix/lib/libhybris/linker/q.so
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hybris-prefix/lib" \
            hybris-probe/hybris_loader_probe \
            "$GITHUB_WORKSPACE/hybris-probe/libnuah-hybris-probe.so"
          probe="$GITHUB_WORKSPACE/hybris-probe/libnuah-hybris-host-dependency-probe.so"
          set +e
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hybris-prefix/lib" \
            hybris-probe/hybris_loader_probe "$probe"
          probe_status=$?
          set -e
          if [ "$probe_status" -ne 0 ]; then
            echo "::error::host-hook dependency probe exited with $probe_status"
            gdb --batch \
              -ex "set env LD_LIBRARY_PATH $GITHUB_WORKSPACE/hybris-prefix/lib" \
              -ex run \
              -ex 'thread apply all bt full' \
              --args hybris-probe/hybris_loader_probe "$probe" || true
            exit "$probe_status"
          fi

  build:
    needs: hybris-x86_64-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Retrieve the pinned libhybris runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: nuah-libhybris-x86_64
          path: build-ci/hybris

      - name: Retrieve the verified API-36 bionic core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep the source run explicit: a native runtime must never silently
          # consume an unverified artifact from an unrelated build.
          gh run download 30408623995 --repo "$GITHUB_REPOSITORY" \
            --name nuah-bionic-core-api36-x86_64 --dir build-ci/bionic
          test -s build-ci/bionic/lib64/linker64
          test -s build-ci/bionic/lib64/libc.so
          # upload-artifact restores the contents of bionic-core directly,
          # while the manifest intentionally records its source-root prefix.
          (cd build-ci/bionic && sed 's# bionic-core/# #' SHA256SUMS | sha256sum --check)

      - name: Build the Android-side bionic loader helper
        run: |
          set -euo pipefail
          ndk_root="$RUNNER_TEMP/android-ndk"
          curl --fail --location --retry 5 --retry-all-errors \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/android-ndk-r29" "$ndk_root"
          # r29's newest packaged NDK CRT is API 35.  This helper has no
          # Android API surface beyond dlopen and runs under the API-36
          # linker/libc bundled below; its minimum API does not downgrade the
          # runtime bionic ABI used for Roblox.
          "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang" \
            -std=c17 -O2 -Wall -Wextra -Werror \
            nuah/helper/bionic_loader_main.c nuah/helper/jni_facade.c -ldl \
            -o build-ci/bionic/nuah-bionic-loader
          android_clang="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          "$android_clang" -std=c17 -O2 -Wall -Wextra -Werror -shared -fPIC \
            -DNUAH_EGL_PROXY -Wl,-soname,libEGL.so \
            nuah/helper/graphics_proxy.c -o build-ci/bionic/lib64/libEGL.so
          "$android_clang" -std=c17 -O2 -Wall -Wextra -Werror -shared -fPIC \
            -DNUAH_GLES_PROXY -Wl,-soname,libGLESv2.so \
            nuah/helper/graphics_proxy.c -o build-ci/bionic/lib64/libGLESv2.so
          for provider in libandroid.so liblog.so libmediandk.so libOpenSLES.so libOpenMAXAL.so; do
            "$android_clang" -std=c17 -O2 -Wall -Wextra -Werror -shared -fPIC \
              -Wl,-soname,"$provider" nuah/helper/platform_proxy.c \
              -o "build-ci/bionic/lib64/$provider"
          done
          readelf --program-headers build-ci/bionic/nuah-bionic-loader | \
            grep -F '/system/bin/linker64'

      - name: Install host dependencies
        run: |
          set -euo pipefail
          packages=(
            cmake ninja-build ccache pkg-config default-jdk libegl-dev libgtk-4-dev
            libadwaita-1-dev libwebkitgtk-6.0-dev libasound2-dev
            libpipewire-0.3-dev libpulse-dev libsndio-dev libxss-dev libgbm-dev
            libdecor-0-dev libavcodec-dev libcap-dev libdrm-dev libffi-dev
            libglib2.0-dev libgudev-1.0-dev libportal-dev libsqlite3-dev
            libvulkan-dev libopenxr-dev libunwind-dev libelf-dev libicu-dev
            libssl-dev libexpat1-dev liblz4-dev liblzma-dev libarchive-dev
            zlib1g-dev
          )
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null |
                grep -q '^install ok installed$'; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]} == 0)); then
            echo 'All host dependencies are already installed on this runner.'
            exit 0
          fi
          printf 'Missing host packages: %s\n' "${missing[*]}"
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Use-Pty=0
          )
          # A runner-side mirror stall must fail this step promptly.  It is
          # preferable to retry a fresh job than to leave the entire Nuah
          # build blocked until the workflow-level timeout.
          timeout 5m sudo apt-get "${apt_options[@]}" update
          timeout 10m sudo apt-get "${apt_options[@]}" install -y \
            --no-install-recommends "${missing[@]}"

      - name: Restore C/C++ compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: nuah-ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/libhybris.lock', 'third_party/android2gnulinux/**', 'third_party/libnativehelper/**') }}
          restore-keys: |
            nuah-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=1G
          ccache --zero-stats

      - name: Install prebuilt SDL3 development package
        run: |
          set -euo pipefail
          mkdir -p .ci/sdl3
          base=https://deb.debian.org/debian/pool/main/libs/libsdl3
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/libsdl3-0_3.2.10+ds-1_amd64.deb" \
            -o .ci/sdl3/libsdl3-0.deb
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/libsdl3-dev_3.2.10+ds-1_amd64.deb" \
            -o .ci/sdl3/libsdl3-dev.deb
          dpkg-deb -x .ci/sdl3/libsdl3-0.deb .ci/sdl3/root
          dpkg-deb -x .ci/sdl3/libsdl3-dev.deb .ci/sdl3/root
          prefix="$GITHUB_WORKSPACE/.ci/sdl3/root"
          echo "PKG_CONFIG_PATH=$prefix/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure Nuah native runtime
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNUAH_SDL3_ROOT="$GITHUB_WORKSPACE/.ci/sdl3/root" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build native providers and supervisor
        run: cmake --build build-ci --parallel

      - name: Run native ABI tests
        run: |
          ctest --test-dir build-ci --output-on-failure
          # __stack_chk_fail is the normal host stack-protector ABI.  Reject
          # only Android's fortified libc entry points, which cannot be
          # satisfied by the host-loaded provider modules.
          if readelf --dyn-syms --wide build-ci/android/*.so | \
              awk '$7 == "UND" { print $8 }' | \
              grep -E '(__memcpy_chk|__memmove_chk|__memset_chk|__strcpy_chk|__strncpy_chk|__strcat_chk|__strncat_chk|__strlen_chk|__sprintf_chk|__snprintf_chk|__vsprintf_chk|__vsnprintf_chk|__fprintf_chk|__printf_chk|__vfprintf_chk)'; then
            echo 'Android-facing provider imports a fortified libc ABI symbol.' >&2
            exit 1
          fi

      - name: Report compiler cache statistics
        run: ccache --show-stats

      - name: Publish native runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuah-native-runtime-x86_64
          path: |
            build-ci/nuah
            build-ci/nuah-services
            build-ci/libnuah_host_bridge.so
            build-ci/libnuah_atl_overlay.so
            build-ci/android/*.so
            build-ci/android/linker-deps/*.so
            build-ci/hybris/lib/libhybris-common.so*
            build-ci/hybris/lib/libhybris/linker/*.so
            build-ci/bionic
          if-no-files-found: error
