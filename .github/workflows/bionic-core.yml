name: Extract API-36 bionic core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs unzip

      - name: Fetch the API-36 x86_64 image as CI-only input
        run: |
          set -euo pipefail
          tools_root="$RUNNER_TEMP/android-tools"
          mkdir -p "$tools_root"
          curl --fail --location --retry 5 --retry-all-errors \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o "$RUNNER_TEMP/commandline-tools.zip"
          unzip -q "$RUNNER_TEMP/commandline-tools.zip" -d "$tools_root"
          sdkmanager="$tools_root/cmdline-tools/bin/sdkmanager"
          # sdkmanager exits as soon as it has consumed the licenses, which
          # gives `yes` SIGPIPE under `pipefail`; that is a successful accept.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$tools_root/sdk" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$tools_root/sdk" \
            'system-images;android-36;google_apis;x86_64'

      - name: Fetch a checksum-verified logical-partition extractor
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/lpunpack"
          mkdir -p "$tool_root"
          release=https://github.com/soe1hom-arch/lpunpack-go/releases/download/v1.0.7
          curl --fail --location --retry 5 --retry-all-errors \
            "$release/lpunpack-linux-amd64" -o "$tool_root/lpunpack-linux-amd64"
          curl --fail --location --retry 5 --retry-all-errors \
            "$release/lpunpack_sha256sums.txt" -o "$tool_root/SHA256SUMS"
          (cd "$tool_root" && grep ' lpunpack-linux-amd64$' SHA256SUMS | sha256sum --check)
          mv "$tool_root/lpunpack-linux-amd64" "$tool_root/lpunpack"
          chmod +x "$tool_root/lpunpack"

      - name: Extract the minimal bionic runtime bundle
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/android-tools/sdk/system-images/android-36/google_apis/x86_64/system.img"
          test -s "$image"
          work="$RUNNER_TEMP/bionic-core"
          mkdir -p "$work/image" "$work/apex" bionic-core/lib64
          # Google currently publishes this image as raw ext4; accept sparse
          # images too so the pinned source format can change safely.
          if file "$image" | grep -qi 'android sparse'; then
            simg2img "$image" "$work/system.raw.img"
          else
            cp "$image" "$work/system.raw.img"
          fi
          partition_table=$(sfdisk --json "$work/system.raw.img")
          printf '%s\n' "$partition_table" | jq -r '.partitiontable.partitions[] | [.start, .size, (.name // "unnamed")] | @tsv'
          super_partition=
          while IFS=$'\t' read -r start size name; do
            echo "checking GPT partition $name (start=$start sectors, size=$size sectors)"
            dd if="$work/system.raw.img" of="$work/candidate.ext4.img" bs=512 \
              skip="$start" count="$size" status=none
            if [ "$name" = super ]; then
              super_partition="$work/candidate.ext4.img"
              break
            fi
          done < <(printf '%s\n' "$partition_table" | jq -r '.partitiontable.partitions[] | [.start, .size, (.name // "unnamed")] | @tsv' | sort -nr -k2)
          if [ -z "$super_partition" ]; then
            echo 'error: API image GPT has no dynamic super partition' >&2
            exit 1
          fi
          "$RUNNER_TEMP/lpunpack/lpunpack" "$super_partition" "$work/logical"
          runtime_partition=
          runtime_apex_path=
          while IFS= read -r candidate; do
            # /apex is the path after Android has mounted the APEX.  The
            # unpacked system partition stores the same package under
            # /system/apex instead.
            for apex_path in /apex/com.android.runtime.apex /system/apex/com.android.runtime.apex; do
              probe=$(debugfs -R "stat $apex_path" "$candidate" 2>&1 || true)
              if grep -q 'Inode:' <<<"$probe"; then
                runtime_partition="$candidate"
                runtime_apex_path="$apex_path"
                break 2
              fi
            done
          done < <(find "$work/logical" -maxdepth 1 -type f -name '*.img' | sort)
          if [ -z "$runtime_partition" ]; then
            echo 'error: no logical image contains the runtime APEX at /apex or /system/apex' >&2
            echo 'logical images and relevant directories:' >&2
            while IFS= read -r candidate; do
              echo "--- $(basename "$candidate") ---" >&2
              for path in / /apex /system /system/apex /lib64 /lib64/bionic /system/lib64 /system/lib64/bionic; do
                echo "[$path]" >&2
                debugfs -R "ls -l $path" "$candidate" 2>&1 >&2 || true
              done
            done < <(find "$work/logical" -maxdepth 1 -type f -name '*.img' | sort)
            exit 1
          fi
          echo "runtime APEX found in $(basename "$runtime_partition"):$runtime_apex_path"
          debugfs -R "dump -p $runtime_apex_path $work/runtime.apex" \
            "$runtime_partition"
          if ! test -s "$work/runtime.apex"; then
            echo 'error: logical system image has no com.android.runtime APEX' >&2
            debugfs -R 'ls -l /apex' "$runtime_partition" >&2 || true
            exit 1
          fi
          if ! unzip -q "$work/runtime.apex" -d "$work/apex"; then
            echo 'error: extracted runtime APEX is not a readable ZIP/APEX archive' >&2
            exit 1
          fi
          for library in libc.so libdl.so libm.so linker64; do
            if ! debugfs -R "dump -p /lib64/bionic/$library $work/$library" \
                "$work/apex/apex_payload.img"; then
              echo "error: runtime APEX is missing /lib64/bionic/$library" >&2
              debugfs -R 'ls -l /lib64/bionic' "$work/apex/apex_payload.img" >&2 || true
              exit 1
            fi
          done
          install -m 0644 "$work/libc.so" bionic-core/lib64/libc.so
          install -m 0644 "$work/libdl.so" bionic-core/lib64/libdl.so
          install -m 0644 "$work/libm.so" bionic-core/lib64/libm.so
          install -m 0755 "$work/linker64" bionic-core/lib64/linker64
          sha256sum bionic-core/lib64/* | sort > bionic-core/SHA256SUMS
          printf 'api=36\nabi=x86_64\nsource=system-images;android-36;google_apis;x86_64\n' \
            > bionic-core/METADATA

      - name: Publish bionic core only
        uses: actions/upload-artifact@v4
        with:
          name: nuah-bionic-core-api36-x86_64
          path: bionic-core
          if-no-files-found: error
